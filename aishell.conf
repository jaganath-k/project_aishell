# AiShell Configuration — Week 9: MCP Server + FTP Service
# Edit and restart aishell, or use: server config key=value

# Server settings
server_enabled=1
server_port=9000
server_max_clients=16
server_timeout=60

# Commands allowed via MCP run_command tool (comma-separated)
server_allowlist=ls,cat,grep

# RAG settings
rag_enabled=1
rag_top_k=5
rag_min_score=0.10

# Logging
log_file=aishell_calls.log
log_mcp_calls=1

# AI model (api_key read from OPENROUTER_API_KEY env var)
ai_model=meta-llama/llama-3.1-8b-instruct:free
